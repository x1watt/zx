name: zx
description: >-
  Pure Dart port of 7-Zip (the public domain LZMA SDK, as used by 7zr):
  7z, xz and lzma archives with LZMA, LZMA2, PPMd, BCJ/BCJ2 and branch
  filters, Delta and AES-256. Usable as a library and as a command line
  tool with 7-Zip's switches.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  7z: 7z

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
