<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The web version of zx (tool/build_web.sh, docs/app.md). The base
       is set by flutter build web --base-href. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="zx in the browser: open 7z, zip, rar, tar, zpaq and .zx archives from your files or from an address, read only.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-256.png">
  <link rel="manifest" href="manifest.json">
  <title>zx online</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #zx-loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 12px; color: #555; }
    #zx-loading img { width: 72px; height: 72px; }
  </style>
</head>
<body>
  <div id="zx-loading">
    <img src="icons/Icon-256.png" alt="">
    <div>Loading zx...</div>
    <noscript>zx online needs JavaScript and WebAssembly.</noscript>
  </div>
  <script>
    // the loading note goes away with the first frame of the app
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('zx-loading');
      if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
