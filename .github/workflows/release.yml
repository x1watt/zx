# Builds the zx command line tool for Linux, Windows and macOS, and the
# Android app (zx.apk, on tags and manual runs). Every push and pull request
# runs the tests and uploads the binaries as workflow artifacts; a pushed tag
# v* also attaches them to a GitHub release.
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get update && sudo apt-get install -y 7zip xz-utils
      - run: sudo ln -sf "$(command -v 7z || command -v 7zz)" /usr/bin/7z || true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: zx-linux-x64, args: --target-os linux --target-arch x64 }
          - { os: ubuntu-latest, name: zx-linux-arm64, args: --target-os linux --target-arch arm64 }
          - { os: windows-latest, name: zx-windows-x64.exe, args: '' }
          - { os: windows-11-arm, name: zx-windows-arm64.exe, args: '' }
          - { os: macos-latest, name: zx-macos-arm64, args: '' }
          - { os: macos-15-intel, name: zx-macos-x64, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: mkdir -p dist
        shell: bash
      - run: dart compile exe ${{ matrix.args }} bin/zx.dart -o dist/${{ matrix.name }}
        shell: bash
      # the icon and version information of the Windows executables; the
      # edited file replaces the original only when it still runs
      - name: Windows icon
        if: runner.os == 'Windows'
        shell: bash
        run: tool/windows_exe_icon.sh dist/${{ matrix.name }}
      - name: Smoke test
        if: ${{ !contains(matrix.args, 'arm64') }}
        shell: bash
        run: |
          mkdir -p smoke/in && echo hello > smoke/in/a.txt
          ./dist/${{ matrix.name }} a smoke/t.7z ./smoke/in
          ./dist/${{ matrix.name }} t smoke/t.7z
          ./dist/${{ matrix.name }} x -osmoke/out smoke/t.7z
          cmp smoke/in/a.txt smoke/out/in/a.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  # The Android app, signed with the release key from the repository secrets
  # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
  # ANDROID_KEY_PASSWORD). A tag never publishes a debug-signed APK; a
  # manual run without the secrets builds one for testing.
  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter --version
      - name: Release key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::the release key secrets are not set"; exit 1
            fi
            echo "::warning::no release key: the APK is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/zx-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/zx-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
      - name: Build zx.apk
        shell: bash
        run: |
          name=0.0.0
          [[ "$GITHUB_REF" == refs/tags/v* ]] && name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1
          cd app
          flutter build apk --release --build-name="$name" --build-number="$code"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/zx.apk
      - name: Check the signature
        shell: bash
        run: |
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          certs=$("$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs dist/zx.apk)
          echo "$certs"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && grep -q "CN=Android Debug" <<< "$certs"; then
            echo "::error::zx.apk is signed with the debug key"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zx.apk
          path: dist/zx.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
